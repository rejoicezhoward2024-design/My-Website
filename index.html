<!DOCTYPE html>
<html>
<head>
    <title>My Clothing Brand</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav>
        <h2>MY BRAND</h2>
        <ul>
            <li>Home</li>
            <li>Shop</li>
            <li>Contact</li>
        </ul>
    </nav>

    <!-- HERO SECTION -->
    <section class="hero">
        <h1>New Collection 2026</h1>
        <p>Style that defines you</p>
        <button>Shop Now</button>
    </section>

    <!-- PRODUCTS -->
    <section class="products">
        <h2>Featured Products</h2>

        <div class="product-grid">
            <div class="product">
                <img src="images/shirt1.jpg">
                <h3>Classic T-Shirt</h3>
                <p>$25</p>
            </div>

            <div class="product">
                <img src="images/shirt2.jpg">
                <h3>Street Hoodie</h3>
                <p>$45</p>
            </div>

            <div class="product">
                <img src="images/shirt3.jpg">
                <h3>Denim Jacket</h3>
                <p>$60</p>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
